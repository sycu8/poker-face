<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Poker Faces">
  <title>Poker Faces monochrome mark</title>
  <!-- Single-color stamp: currentColor for CSS theming; default Night -->
  <g fill="currentColor" color="#07100D">
    <!-- Back card outline + F -->
    <g transform="translate(34 32) rotate(14) translate(-18 -26)">
      <rect x="1" y="1" width="34" height="50" rx="4" fill="none" stroke="currentColor" stroke-width="2.25"/>
      <path d="M11 14h6.2c3.4 0 5.6 1.9 5.6 4.7 0 2.2-1.2 3.7-3.2 4.4l3.8 9.4h-5.1l-3.3-8.2H16v8.2H11V14zm5.1 7.4c1.35 0 2.15-.7 2.15-1.85S17.45 17.7 16.1 17.7H16v3.7h.1z"/>
    </g>
    <!-- Front card solid + P cut via overlapping (drawn filled card then inverse letter via draw) -->
    <g transform="translate(26 32) rotate(-12) translate(-18 -26)">
      <rect x="0" y="0" width="36" height="52" rx="4.5" fill="currentColor"/>
      <!-- P counter (knockout illusion: ivory hole simulated by larger stroke gap — use mask) -->
    </g>
  </g>
  <defs>
    <mask id="pKnock">
      <rect x="0" y="0" width="64" height="64" fill="white"/>
      <g transform="translate(26 32) rotate(-12) translate(-18 -26)">
        <path fill="black" d="M11 14h7.2c4.3 0 7 2.5 7 6.4 0 3.9-2.7 6.4-7 6.4H16v9.7H11V14zm5.1 9.5h1.9c2.1 0 3.35-1.15 3.35-3.1S20.1 17.3 18 17.3h-1.9v6.2z"/>
        <circle cx="28.5" cy="11.5" r="1.6" fill="black"/>
      </g>
    </mask>
  </defs>
  <!-- Redraw front card with P knockout for true monochrome -->
  <g fill="currentColor" color="#07100D" mask="url(#pKnock)">
    <g transform="translate(26 32) rotate(-12) translate(-18 -26)">
      <rect x="0" y="0" width="36" height="52" rx="4.5"/>
    </g>
  </g>
  <!-- Back card stroke + F on top for clarity at 24px -->
  <g fill="none" stroke="currentColor" color="#07100D" stroke-width="2.25">
    <g transform="translate(34 32) rotate(14) translate(-18 -26)">
      <rect x="1" y="1" width="34" height="50" rx="4"/>
    </g>
  </g>
  <g fill="currentColor" color="#07100D">
    <g transform="translate(34 32) rotate(14) translate(-18 -26)">
      <path d="M11 14h6.2c3.4 0 5.6 1.9 5.6 4.7 0 2.2-1.2 3.7-3.2 4.4l3.8 9.4h-5.1l-3.3-8.2H16v8.2H11V14zm5.1 7.4c1.35 0 2.15-.7 2.15-1.85S17.45 17.7 16.1 17.7H16v3.7h.1z"/>
    </g>
  </g>
</svg>
