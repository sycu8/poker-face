<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Poker Faces">
  <title>Poker Faces mark</title>
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.55" flood-color="#07100D" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Back card (F) — offset right so F remains visible -->
  <g transform="translate(38 31) rotate(18) translate(-18 -26)" filter="url(#soft)">
    <rect x="0" y="0" width="36" height="52" rx="4.5" fill="#0F4C35" stroke="#F4BC56" stroke-width="2"/>
    <!-- F shifted toward exposed edge -->
    <path fill="#F6F2E7" d="M14 12h16v5.2H19.4v4.6h9.2v4.8H19.4V40H14V12z"/>
  </g>
  <!-- Front card (P) -->
  <g transform="translate(24 33) rotate(-11) translate(-18 -26)" filter="url(#soft)">
    <rect x="0" y="0" width="36" height="52" rx="4.5" fill="#F6F2E7" stroke="#F4BC56" stroke-width="2"/>
    <path fill="#0F4C35" d="M10.5 13h8c4.6 0 7.5 2.6 7.5 6.7 0 4.1-2.9 6.7-7.5 6.7H15.8v10.1h-5.3V13zm5.3 9.9h2.4c2.2 0 3.5-1.2 3.5-3.2S20.4 16.5 18.2 16.5h-2.4v6.4z"/>
    <circle cx="28.5" cy="11" r="1.7" fill="#F4BC56"/>
  </g>
</svg>
