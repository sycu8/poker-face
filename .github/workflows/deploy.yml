name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
          - all
        default: all
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:domain
      - run: npm run build
      - name: Require Cloudflare deploy secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Set GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "See docs/GITHUB_ACTIONS_DEPLOY.md"
            exit 1
          fi

  deploy-staging:
    needs: validate
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'staging' ||
      github.event.inputs.target == 'all'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prepare staging resources
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID_STAGING }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID_STAGING }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY_STAGING }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN_STAGING }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then export D1_DATABASE_ID="${{ vars.D1_DATABASE_ID_STAGING }}"; fi
          if [ -z "$KV_NAMESPACE_ID" ]; then export KV_NAMESPACE_ID="${{ vars.KV_NAMESPACE_ID_STAGING }}"; fi
          if [ -z "$TURNSTILE_SITE_KEY" ]; then export TURNSTILE_SITE_KEY="${{ vars.TURNSTILE_SITE_KEY_STAGING }}"; fi
          if [ -z "$APP_ORIGIN" ]; then export APP_ORIGIN="https://staging.poker.orangecloud.vn"; fi
          node scripts/ci-prepare-wrangler.mjs staging
      - name: Apply D1 migrations (staging)
        run: npx wrangler d1 migrations apply poker-faces-staging --env staging --remote
      # Vite plugin flattens Cloudflare envs at build time and fills assets.directory.
      # Do not use `wrangler deploy --env …` against source wrangler.jsonc.
      - name: Build staging Worker (CLOUDFLARE_ENV)
        run: CLOUDFLARE_ENV=staging npm run build
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Upload Worker secrets (staging)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET_STAGING }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY_STAGING }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.REALTIMEKIT_API_TOKEN }}
          REALTIMEKIT_API_TOKEN_STAGING: ${{ secrets.REALTIMEKIT_API_TOKEN_STAGING }}
          REALTIMEKIT_APP_ID: ${{ secrets.REALTIMEKIT_APP_ID }}
          REALTIMEKIT_PRESET_NAME: ${{ secrets.REALTIMEKIT_PRESET_NAME }}
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: |
          if [ -z "$SESSION_SECRET" ]; then export SESSION_SECRET="${{ secrets.SESSION_SECRET }}"; fi
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then export TURNSTILE_SECRET_KEY="${{ secrets.TURNSTILE_SECRET_KEY }}"; fi
          if [ -z "$REALTIMEKIT_API_TOKEN" ]; then export REALTIMEKIT_API_TOKEN="${REALTIMEKIT_API_TOKEN_STAGING:-}"; fi
          if [ -z "$REALTIMEKIT_APP_ID" ]; then export REALTIMEKIT_APP_ID="${{ vars.REALTIMEKIT_APP_ID }}"; fi
          if [ -z "$REALTIMEKIT_PRESET_NAME" ]; then export REALTIMEKIT_PRESET_NAME="${{ vars.REALTIMEKIT_PRESET_NAME }}"; fi
          if [ -z "$SESSION_SECRET" ]; then
            echo "::warning::SESSION_SECRET / SESSION_SECRET_STAGING not in Actions secrets — skipping secret bulk so existing Worker secrets are retained. Set the secret for future updates (do not generate ephemeral values)."
          else
            node scripts/ci-write-secrets-file.mjs .ci-secrets-staging.json
            # Target the named Worker via source env; secrets are not in the Vite output config.
            npx wrangler secret bulk .ci-secrets-staging.json --env staging --config wrangler.jsonc
            rm -f .ci-secrets-staging.json
          fi
          if [ -z "${REALTIMEKIT_API_TOKEN:-}" ]; then
            echo "::warning::REALTIMEKIT_API_TOKEN is empty — voice will stay not_configured unless already set on the Worker. Set Actions secret REALTIMEKIT_API_TOKEN (Realtime Admin), then re-run Deploy Cloudflare."
          else
            echo "REALTIMEKIT_API_TOKEN is present for staging (len=${#REALTIMEKIT_API_TOKEN})."
          fi
      - name: Redeploy staging after secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Staging smoke
        run: |
          set -euo pipefail
          BASE="${{ vars.APP_ORIGIN_STAGING }}"
          if [ -z "$BASE" ]; then BASE="https://staging.poker.orangecloud.vn"; fi
          FALLBACK="https://poker-faces-staging.sycu-lee.workers.dev"
          echo "Probing $BASE/api/health"
          if curl -fsS --retry 5 --retry-all-errors --retry-delay 3 \
            -A "PokerFaces-DeploySmoke/1.0 (+https://github.com/sycu8/poker-face)" \
            "$BASE/api/health" | tee /tmp/health.json; then
            grep -q '"ok":true' /tmp/health.json
          else
            echo "::warning::Custom domain not reachable; probing workers.dev fallback $FALLBACK"
            curl -fsS --retry 5 --retry-all-errors --retry-delay 3 \
              -A "PokerFaces-DeploySmoke/1.0 (+https://github.com/sycu8/poker-face)" \
              "$FALLBACK/api/health" | tee /tmp/health.json
            grep -q '"ok":true' /tmp/health.json
          fi

  deploy-production:
    needs: [validate, deploy-staging]
    if: >
      always() &&
      needs.validate.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') &&
      (github.event_name == 'push' || github.event.inputs.target == 'production' || github.event.inputs.target == 'all')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prepare production resources
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID_PRODUCTION }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID_PRODUCTION }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY_PRODUCTION }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN_PRODUCTION }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then export D1_DATABASE_ID="${{ vars.D1_DATABASE_ID_PRODUCTION }}"; fi
          if [ -z "$KV_NAMESPACE_ID" ]; then export KV_NAMESPACE_ID="${{ vars.KV_NAMESPACE_ID_PRODUCTION }}"; fi
          if [ -z "$TURNSTILE_SITE_KEY" ]; then export TURNSTILE_SITE_KEY="${{ vars.TURNSTILE_SITE_KEY_PRODUCTION }}"; fi
          if [ -z "$APP_ORIGIN" ]; then export APP_ORIGIN="https://poker.orangecloud.vn"; fi
          if [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo "::warning::TURNSTILE_SITE_KEY_PRODUCTION is empty — guest/auth Turnstile will use an empty site key until set."
          fi
          node scripts/ci-prepare-wrangler.mjs production
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply poker-faces-production --env production --remote
      - name: Build production Worker (CLOUDFLARE_ENV)
        run: CLOUDFLARE_ENV=production npm run build
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Upload Worker secrets (production)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET_PRODUCTION }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY_PRODUCTION }}
          REALTIMEKIT_API_TOKEN: ${{ secrets.REALTIMEKIT_API_TOKEN }}
          REALTIMEKIT_API_TOKEN_PRODUCTION: ${{ secrets.REALTIMEKIT_API_TOKEN_PRODUCTION }}
          REALTIMEKIT_APP_ID: ${{ secrets.REALTIMEKIT_APP_ID }}
          REALTIMEKIT_PRESET_NAME: ${{ secrets.REALTIMEKIT_PRESET_NAME }}
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
          REQUIRE_TURNSTILE: "1"
        run: |
          if [ -z "$SESSION_SECRET" ]; then export SESSION_SECRET="${{ secrets.SESSION_SECRET }}"; fi
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then export TURNSTILE_SECRET_KEY="${{ secrets.TURNSTILE_SECRET_KEY }}"; fi
          if [ -z "$REALTIMEKIT_API_TOKEN" ]; then export REALTIMEKIT_API_TOKEN="${REALTIMEKIT_API_TOKEN_PRODUCTION:-}"; fi
          if [ -z "$REALTIMEKIT_APP_ID" ]; then export REALTIMEKIT_APP_ID="${{ vars.REALTIMEKIT_APP_ID }}"; fi
          if [ -z "$REALTIMEKIT_PRESET_NAME" ]; then export REALTIMEKIT_PRESET_NAME="${{ vars.REALTIMEKIT_PRESET_NAME }}"; fi
          if [ -z "$SESSION_SECRET" ]; then
            echo "::warning::SESSION_SECRET_PRODUCTION (or SESSION_SECRET) not in Actions secrets — skipping secret bulk so existing Worker secrets are retained. Set the secret for future updates (do not generate ephemeral values)."
            if [ -z "$TURNSTILE_SECRET_KEY" ]; then
              echo "::warning::TURNSTILE_SECRET_KEY_PRODUCTION also unset — relying on existing Worker Turnstile secret if any."
            fi
          else
            if [ -z "$TURNSTILE_SECRET_KEY" ]; then
              echo "::warning::TURNSTILE_SECRET_KEY_PRODUCTION unset — uploading SESSION_SECRET without refreshing Turnstile."
              unset REQUIRE_TURNSTILE
            fi
            node scripts/ci-write-secrets-file.mjs .ci-secrets-production.json
            npx wrangler secret bulk .ci-secrets-production.json --env production --config wrangler.jsonc
            rm -f .ci-secrets-production.json
          fi
          if [ -z "${REALTIMEKIT_API_TOKEN:-}" ]; then
            echo "::warning::REALTIMEKIT_API_TOKEN is empty — voice will stay not_configured unless already set on the Worker. Set Actions secret REALTIMEKIT_API_TOKEN (Realtime Admin), then re-run Deploy Cloudflare."
          else
            echo "REALTIMEKIT_API_TOKEN is present for production (len=${#REALTIMEKIT_API_TOKEN})."
          fi
      - name: Redeploy production after secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Production smoke
        run: |
          set -euo pipefail
          BASE="${{ vars.APP_ORIGIN_PRODUCTION }}"
          if [ -z "$BASE" ]; then BASE="https://poker.orangecloud.vn"; fi
          echo "Probing $BASE/api/health (canonical origin)"
          CODE=$(curl -sS -o /tmp/health-prod.json -w "%{http_code}" \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -A "PokerFaces-DeploySmoke/1.0 (+https://github.com/sycu8/poker-face)" \
            "$BASE/api/health" || true)
          echo "HTTP $CODE"
          if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/health-prod.json && grep -q '"environment":"production"' /tmp/health-prod.json; then
            cat /tmp/health-prod.json
            echo
            echo "Canonical origin smoke passed."
            exit 0
          fi
          # Cloudflare Bot Fight / WAF often 403s GitHub Actions egress while real users succeed.
          echo "::warning::Canonical origin smoke returned HTTP $CODE (body below). Falling back to Wrangler deployment verification."
          cat /tmp/health-prod.json 2>/dev/null || true
          echo
          npx wrangler deployments list --name poker-faces --json > /tmp/deployments.json
          node -e '
            const fs = require("node:fs");
            const list = JSON.parse(fs.readFileSync("/tmp/deployments.json", "utf8"));
            const rows = Array.isArray(list) ? list : (list.deployments || list.result || []);
            if (!rows.length) {
              console.error("No deployments returned for poker-faces");
              process.exit(1);
            }
            const createdOf = (d) =>
              Date.parse(d.created_on || d.createdOn || d.created_at || d.createdAt || 0) || 0;
            const latest = [...rows].sort((a, b) => createdOf(b) - createdOf(a))[0];
            const createdMs = createdOf(latest);
            console.log("Latest deployment:", JSON.stringify(latest, null, 2).slice(0, 1200));
            if (!createdMs) {
              console.error("Could not parse deployment created_on");
              process.exit(1);
            }
            const ageMs = Date.now() - createdMs;
            if (ageMs > 30 * 60 * 1000) {
              console.error(
                "Latest deployment is older than 30 minutes — refusing smoke fallback.",
                { ageMinutes: Math.round(ageMs / 60000) },
              );
              process.exit(1);
            }
            console.log("Wrangler confirms a recent production Worker deployment.");
          '
